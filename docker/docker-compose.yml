# ---------------------------------------------------------------------------
# WHY THESE SERVICES, IN THIS SHAPE
# ---------------------------------------------------------------------------
# minio        -> Data Lake (raw zone). S3-compatible object storage, so the
#                 same boto3/S3A code works unchanged if we later point it
#                 at real AWS S3.
# postgres     -> Data Warehouse (curated zone), holding the star schema.
# spark-master
# spark-worker (x2) -> A real (small) distributed cluster, not single-node
#                 local mode, so job submission and parallelism are genuine
#                 and demonstrable, not simulated.
# postgres-airflow, airflow-* -> Orchestration layer. A SEPARATE Postgres
#                 holds Airflow's own metadata (DAG runs, task logs), kept
#                 apart from the Data Warehouse, which holds business data.
#
# All services share one Docker network ("data_platform_net") so they can
# reach each other by service name (e.g. Spark jobs connect to
# "postgres:5432" and "minio:9000", not "localhost").
# ---------------------------------------------------------------------------

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: airflow.Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "a-local-dev-secret-change-if-ever-shared"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ../dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock   # lets tasks run "docker exec" against the Spark cluster
  user: "50000:0"   # the airflow image's default user; root broke Python's package resolution
  depends_on:
    &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy

services:

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - data_platform_net

  postgres:
    image: postgres:16
    container_name: postgres_dwh
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_platform_net

  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # Spark master web UI
      - "7077:7077"   # Spark master port (workers/jobs connect here)
    volumes:
      - ../data_generator:/opt/spark-data
      - ../etl_batch:/opt/spark-jobs
      - ../etl_streaming:/opt/spark-streaming
    networks:
      - data_platform_net

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8081
    ports:
      - "8081:8081"   # Worker 1 web UI
    volumes:
      - ../data_generator:/opt/spark-data
      - ../etl_batch:/opt/spark-jobs
      - ../etl_streaming:/opt/spark-streaming
    depends_on:
      - spark-master
    networks:
      - data_platform_net

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8082
    ports:
      - "8082:8082"   # Worker 2 web UI
    volumes:
      - ../data_generator:/opt/spark-data
      - ../etl_batch:/opt/spark-jobs
      - ../etl_streaming:/opt/spark-streaming
    depends_on:
      - spark-master
    networks:
      - data_platform_net

  # One-shot service: creates the MinIO bucket that will hold the Data
  # Lake's raw zone, then exits. This is the standard "init container"
  # pattern -- a container whose only job is a one-time setup task, not a
  # long-running service.
  createbuckets:
    image: minio/mc:latest
    container_name: createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'waiting for minio...'; sleep 2; done;
      /usr/bin/mc mb myminio/raw-zone --ignore-existing;
      echo 'raw-zone bucket ready';
      exit 0;
      "
    networks:
      - data_platform_net

  # ---------------------------------------------------------------------
  # Kafka -- streaming ingestion layer (Palier 2).
  #
  # KRaft mode: Kafka manages its own cluster metadata internally, instead
  # of relying on a separate Zookeeper service (the older architecture).
  # For a single-node dev setup, this one container acts as BOTH the
  # broker (handles producer/consumer traffic) and the controller
  # (manages cluster metadata) -- KAFKA_PROCESS_ROLES: 'broker,controller'.
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - data_platform_net

  postgres-airflow:
    image: postgres:16
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - data_platform_net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username airflow --password airflow --firstname Manal --lastname ElKachach --role Admin --email admin@example.com || true"
    networks:
      - data_platform_net

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8090:8080"   # 8080 is already taken by the Spark master UI
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data_platform_net

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data_platform_net

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data_platform_net

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data_platform_net

volumes:
  minio_data:
  postgres_data:
  postgres_airflow_data:
  airflow_logs:

networks:
  data_platform_net:
    driver: bridge