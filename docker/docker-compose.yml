# ---------------------------------------------------------------------------
# WHY THESE SERVICES, IN THIS SHAPE
# ---------------------------------------------------------------------------
# minio        -> Data Lake (raw zone). S3-compatible object storage, so the
#                 same boto3/S3A code works unchanged if we later point it
#                 at real AWS S3.
# postgres     -> Data Warehouse (curated zone), holding the star schema.
# spark-master
# spark-worker (x2) -> A real (small) distributed cluster, not single-node
#                 local mode, so job submission and parallelism are genuine
#                 and demonstrable, not simulated.
#
# All services share one Docker network ("data_platform_net") so they can
# reach each other by service name (e.g. Spark jobs connect to
# "postgres:5432" and "minio:9000", not "localhost").
# ---------------------------------------------------------------------------

services:

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - data_platform_net

  postgres:
    image: postgres:16
    container_name: postgres_dwh
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_platform_net

  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # Spark master web UI
      - "7077:7077"   # Spark master port (workers/jobs connect here)
    volumes:
      - ../data_generator:/opt/spark-data
      - ../etl_batch:/opt/spark-jobs
    networks:
      - data_platform_net

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8081
    ports:
      - "8081:8081"   # Worker 1 web UI
    volumes:
      - ../data_generator:/opt/spark-data
      - ../etl_batch:/opt/spark-jobs
    depends_on:
      - spark-master
    networks:
      - data_platform_net

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8082
    ports:
      - "8082:8082"   # Worker 2 web UI
    volumes:
      - ../data_generator:/opt/spark-data
      - ../etl_batch:/opt/spark-jobs
    depends_on:
      - spark-master
    networks:
      - data_platform_net

  # One-shot service: creates the MinIO bucket that will hold the Data
  # Lake's raw zone, then exits. This is the standard "init container"
  # pattern -- a container whose only job is a one-time setup task, not a
  # long-running service.
  createbuckets:
    image: minio/mc:latest
    container_name: createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'waiting for minio...'; sleep 2; done;
      /usr/bin/mc mb myminio/raw-zone --ignore-existing;
      echo 'raw-zone bucket ready';
      exit 0;
      "
    networks:
      - data_platform_net

volumes:
  minio_data:
  postgres_data:

networks:
  data_platform_net:
    driver: bridge